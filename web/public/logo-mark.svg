<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="JVO">
  <!-- Identidade visual JVO: balão de conversa com "JV", o V como um check em verde-água -->
  <rect width="100" height="100" rx="22" fill="#0e302c"/>
  <g fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <!-- balão: contorno branco com o rabinho embaixo, à esquerda -->
    <path stroke="#ffffff" d="M61 72 H37 C25.5 72 17 63.5 17 52 V39 C17 27.5 25.5 19 37 19 H63 C74.5 19 83 27.5 83 39 V51 M28 70.5 L27.5 82 L44 72"/>
    <!-- quarto inferior direito do balão em verde-água -->
    <path stroke="#4ecdb1" d="M83 51 V52 C83 63.5 74.5 72 63 72 H61"/>
  </g>
  <g fill="none" stroke-width="7.5" stroke-linejoin="round">
    <!-- J -->
    <path stroke="#ffffff" stroke-linecap="butt" d="M37 32.5 V49 C37 54.5 34 57.5 29.5 57.5 C26.5 57.5 24.5 56 23.5 53.5"/>
    <!-- V: haste esquerda branca, haste direita em verde-água (o check) -->
    <path stroke="#ffffff" stroke-linecap="butt" d="M45.5 32.5 L55.5 56"/>
    <path stroke="#4ecdb1" stroke-linecap="round" d="M55.5 56 L66.5 33"/>
  </g>
</svg>
